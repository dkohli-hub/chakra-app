<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chakra™ — Karma Kshetra™</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0D1117; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes checkPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    @keyframes taskDone {
      from { opacity: 1; max-height: 80px; }
      to   { opacity: 0; max-height: 0; padding: 0; margin: 0; }
    }

    .fade-in    { animation: fadeSlideIn 0.25s ease forwards; }
    .check-pop  { animation: checkPop 0.25s ease; }
    .task-done  { animation: taskDone 0.3s ease forwards; }
  </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
