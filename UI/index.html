<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chakra™ — Karma Kshetra™</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #0D1117; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

      /* Remove any white border/outline */
      :focus { outline: none; }
      :focus-visible { outline: 2px solid #1A6B5A; outline-offset: 2px; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0D1117; }
      ::-webkit-scrollbar-thumb { background: #21262D; border-radius: 3px; }

      /* Animations */
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes checkPop {
        0%   { transform: scale(1); }
        45%  { transform: scale(1.35); }
        100% { transform: scale(1); }
      }
      @keyframes taskDone {
        from { opacity: 1; max-height: 100px; margin-bottom: 0.4rem; }
        to   { opacity: 0; max-height: 0;    margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
      }
      @keyframes tabPop {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.18); }
        100% { transform: scale(1); }
      }

      .fade-in   { animation: fadeSlideIn 0.22s ease forwards; }
      .check-pop { animation: checkPop 0.25s ease; }
      .task-done { animation: taskDone 0.28s ease forwards; overflow: hidden; }

      /* Responsive helpers */
      @media (max-width: 480px) {
        h1 { font-size: 1.1rem !important; }
        main { padding: 0.5rem !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
